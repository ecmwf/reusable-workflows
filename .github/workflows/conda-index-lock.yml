name: Conda Index Lock
run-name: Conda index ${{ inputs.package_artifact_name }} from ${{ inputs.caller_repo }}#${{ inputs.caller_run_id }} (${{ inputs.dispatch_id }})

on:
  workflow_dispatch:
    # No credentials are passed in: dispatch inputs show up in the run's metadata.
    # The Nexus credentials come from the org secrets for the chosen channel.
    inputs:
      channel:
        description: 'Conda channel to index (selects the Nexus URL from cd-actions/conda/config/nexus.yml and the credentials)'
        required: true
        type: choice
        options:
          - test
          - production
      package_artifact_name:
        description: 'Name of the artifact containing conda packages'
        required: true
        type: string
      caller_run_id:
        description: 'Run ID of the calling workflow'
        required: true
        type: string
      caller_repo:
        description: 'Repository that called this lock (owner/repo)'
        required: true
        type: string
      dispatch_id:
        description: 'Unique lock dispatch identifier'
        required: true
        type: string

# CRITICAL: Only one indexing operation at a time
concurrency:
  group: conda-index-lock
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  index:
    name: Index Conda Repository
    runs-on: [self-hosted, platform-builder]
    steps:
      - name: Check CD kill switch
        if: ${{ vars.CD_KILL_SWITCH == 'on' }}
        shell: bash
        env:
          REASON: ${{ vars.CD_KILL_SWITCH_REASON }}
        run: |
          echo "::error::CD is disabled by the CD_KILL_SWITCH variable: ${REASON:-no reason given}"
          exit 1

      - name: Validate request
        shell: bash
        env:
          CALLER_REPO: ${{ inputs.caller_repo }}
          CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          ARTIFACT_NAME: ${{ inputs.package_artifact_name }}
        run: |
          if [[ ! "$CALLER_REPO" =~ ^ecmwf/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::caller_repo must be an ecmwf repository, got '$CALLER_REPO'"
            exit 1
          fi
          if [[ ! "$CALLER_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::caller_run_id must be numeric, got '$CALLER_RUN_ID'"
            exit 1
          fi
          # The conda action names the artifact <caller run id>-<build name>
          if [[ ! "$ARTIFACT_NAME" =~ ^${CALLER_RUN_ID}-[A-Za-z0-9._+-]+$ ]]; then
            echo "::error::package_artifact_name must be '${CALLER_RUN_ID}-<build name>', got '$ARTIFACT_NAME'"
            exit 1
          fi
          echo "Request OK: $ARTIFACT_NAME from $CALLER_REPO run $CALLER_RUN_ID"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup conda env dir
        shell: bash -el {0}
        run: |
          echo "CONDA_ENVS_DIRS=$RUNNER_TEMP/envs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/envs"

      - name: Create conda environment
        shell: bash -el {0}
        run: |
          INDEX_ENV="conda-index-lock-${GITHUB_RUN_ID}"
          echo "INDEX_ENV=$INDEX_ENV" >> "$GITHUB_ENV"
          mamba env create -n "$INDEX_ENV"

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          eval "$(conda shell.bash hook)"
          conda activate "$INDEX_ENV"
          mamba install -y conda-index requests

      - name: Download artifacts from caller workflow
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
          REPO: ${{ inputs.caller_repo }}
          RUN_ID: ${{ inputs.caller_run_id }}
          ARTIFACT_NAME: ${{ inputs.package_artifact_name }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          eval "$(conda shell.bash hook)"
          conda activate "$INDEX_ENV"

          echo "Downloading artifact '$ARTIFACT_NAME' from run $RUN_ID in $REPO"

          python3 << 'EOF'
          import os
          import sys
          import zipfile
          from urllib.parse import quote

          import requests

          repo = os.environ["REPO"]
          run_id = os.environ["RUN_ID"]
          artifact_name = os.environ["ARTIFACT_NAME"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}"}

          # Production indexes only packages built from a tag of the caller repo
          if os.environ["CHANNEL"] == "production":
              resp = requests.get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}", headers=headers)
              resp.raise_for_status()
              run = resp.json()
              head_branch = run.get("head_branch") or ""
              head_sha = run.get("head_sha") or ""
              tag_resp = requests.get(
                  f"https://api.github.com/repos/{repo}/git/ref/tags/{quote(head_branch, safe='')}", headers=headers
              )
              if not head_branch or tag_resp.status_code != 200:
                  print(f"Production indexing needs a caller run on a tag; run {run_id} is on '{head_branch}'", file=sys.stderr)
                  sys.exit(1)
              # A branch can share a tag's name, so the run must also be on the tag's commit.
              # Annotated tags point to a tag object, which points to the commit.
              target = tag_resp.json()["object"]
              if target["type"] == "tag":
                  obj_resp = requests.get(f"https://api.github.com/repos/{repo}/git/tags/{target['sha']}", headers=headers)
                  obj_resp.raise_for_status()
                  target = obj_resp.json()["object"]
              if target["sha"] != head_sha:
                  print(f"Run {run_id} is on {head_sha}, but tag {head_branch} points to {target['sha']}", file=sys.stderr)
                  sys.exit(1)
              print(f"Caller run is on tag {head_branch} ({head_sha})")

          # Get artifact list
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts"
          resp = requests.get(url, headers=headers)
          resp.raise_for_status()

          # Find artifact ID
          artifact_id = None
          for artifact in resp.json()["artifacts"]:
              if artifact["name"] == artifact_name:
                  artifact_id = artifact["id"]
                  break

          if not artifact_id:
              print(f"Artifact '{artifact_name}' not found", file=sys.stderr)
              sys.exit(1)

          # Download artifact zip
          url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip"
          resp = requests.get(url, headers=headers)
          resp.raise_for_status()

          # Extract to ./packages
          os.makedirs("./packages", exist_ok=True)
          with open("/tmp/artifact.zip", "wb") as f:
              f.write(resp.content)
          with zipfile.ZipFile("/tmp/artifact.zip") as z:
              z.extractall("./packages")
          os.remove("/tmp/artifact.zip")

          print("Downloaded and extracted artifact")
          EOF

          echo "Downloaded packages:"
          find ./packages -type f \( -name "*.tar.bz2" -o -name "*.conda" \) | sort

      - name: Rebuild conda index
        shell: bash -el {0}
        env:
          CHANNEL: ${{ inputs.channel }}
          # Selected by name, so a missing production secret never falls back to the test one
          NEXUS_USER: ${{ secrets[inputs.channel == 'production' && 'NEXUS_CONDA_UPLOAD_USER' || 'NEXUS_TEST_CONDA_UPLOAD_USER'] }}
          NEXUS_PASSWORD: ${{ secrets[inputs.channel == 'production' && 'NEXUS_CONDA_UPLOAD_TOKEN' || 'NEXUS_TEST_CONDA_UPLOAD_TOKEN'] }}
        run: |
          if [ -z "$NEXUS_USER" ] || [ -z "$NEXUS_PASSWORD" ]; then
            echo "::error::No Nexus conda upload credentials available for channel '$CHANNEL'"
            exit 1
          fi
          NEXUS_TOKEN="$NEXUS_USER:$NEXUS_PASSWORD"
          echo "::add-mask::$NEXUS_TOKEN"

          # The URL comes from this ref's config, never from the caller
          NEXUS_URL=$(awk -v channel="$CHANNEL" '$0 ~ "^" channel ":" { found = 1; next } found && $1 == "url:" { print $2; exit }' \
            "$GITHUB_WORKSPACE/cd-actions/conda/config/nexus.yml")
          if [ -z "$NEXUS_URL" ]; then
            echo "::error::No Nexus URL for channel '$CHANNEL' in cd-actions/conda/config/nexus.yml"
            exit 1
          fi

          eval "$(conda shell.bash hook)"
          conda activate "$INDEX_ENV"

          echo "Indexing packages to: $NEXUS_URL"

          python "$GITHUB_WORKSPACE/cd-actions/conda/scripts/rebuild_conda_index.py" \
            --package-dir ./packages \
            --nexus-url "$NEXUS_URL" \
            --nexus-token "$NEXUS_TOKEN"

          echo "Indexing completed successfully!"
