---
name: cd-pypi-binwheel

on:
  workflow_call:
    inputs:
      testpypi:
        description: Whether to upload to testpypi instead of pypi.
          Requires secrets.PYPI_TEST_API_TOKEN to be defined.
        type: boolean
        required: false
        default: false
      working-directory:
        description: Working directory to build Python package (for monorepos).
          Defaults to root directory.
        type: string
        required: false
        default: "./"
      platforms:
        description: For not pure python project, the platforms to build for e.g. "['ubuntu-latest','macos-latest','windows-latest']"
        required: false
        type: string
        default: ''
      pyversions:
        description: For not pure python project, the Python versions to build for e.g. "['38','39','310','311','312','313']"
        required: false
        type: string
        default: ''
      env_vars:
        description: A way to set env variables
        type: string
        required: false
        default: ''


jobs:
  deploy:
    if:  ${{ github.ref_type == 'tag' || github.event_name == 'release' || inputs.testpypi || (inputs.platforms != '' && inputs.pyversions != '') }}
    strategy:
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
        python: ${{ fromJson(inputs.pyversions) }}
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check CD kill switch
        if: ${{ vars.CD_KILL_SWITCH == 'on' }}
        shell: bash
        env:
          REASON: ${{ vars.CD_KILL_SWITCH_REASON }}
        run: |
          echo "::error::CD is disabled by the CD_KILL_SWITCH variable: ${REASON:-no reason given}"
          exit 1

      - name: Set env variables from input
        if: inputs.env_vars != ''
        env:
          ENV_VARS: ${{ inputs.env_vars }}
        run: |
          for key in $(echo "$ENV_VARS" | jq -r 'keys[]'); do
            if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || [[ "${key^^}" =~ ^(PATH|BASH_ENV|ENV|NODE_OPTIONS|LD_.*|GITHUB_.*|RUNNER_.*|ACTIONS_.*)$ ]]; then
              echo "::error::Refusing to set environment variable '$key'"
              exit 1
            fi
            value=$(echo "$ENV_VARS" | jq -r --arg key "$key" '.[$key]')
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::Value of environment variable '$key' contains a newline"
              exit 1
            fi
            echo "$key=$value" >> $GITHUB_ENV
          done
        shell: bash

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: "0"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"
      
      - name: Test tag name pattern
        if: ${{ !inputs.testpypi }}
        shell: python
        env:
          TAG_PATTERN: ${{ vars.TAG_REGEX_FOR_DEPLOYMENT }}
        run: |
          import os
          import re
          import sys

          tag_pattern = os.environ.get("TAG_PATTERN", "")
          ref = os.environ["GITHUB_REF_NAME"]

          if not tag_pattern:
            sys.exit(0)

          if not re.match(tag_pattern, ref):
            print(f"::error::{ref} does not match {tag_pattern}")
            sys.exit(1)

      - name: Test branch name pattern
        if: ${{ vars.BRANCH_REGEX_FOR_DEPLOYMENT != '' && !inputs.testpypi }}
        env:
          BRANCH_PATTERN: ${{ vars.BRANCH_REGEX_FOR_DEPLOYMENT }}
        run: |
          echo "Checking that this release is being made from a main/master branch ( $BRANCH_PATTERN ) - will fail if not"
          git branch --all --list --format "%(refname:lstrip=3)" --contains "$GITHUB_REF_NAME" | grep -E "$BRANCH_PATTERN"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine setuptools wheel cibuildwheel setuptools-rust

      - name: Check version
        shell: python
        env:
          INPUT_TESTPYPI: ${{ inputs.testpypi }}
        run: |
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          if Path("setup.py").is_file():
              if Path("pyproject.toml").is_file():
                  with open("pyproject.toml", "rb") as f:
                      data = tomllib.load(f)
                  requires = data["build-system"]["requires"]
                  subprocess.run(["pip", "install", "--upgrade", *requires], check=True)

              result = subprocess.run(["python", "setup.py", "--version"], capture_output=True, text=True, check=True)
              version = result.stdout.strip()
              release = os.environ.get("GITHUB_REF_NAME")
              testpypi = os.environ.get("INPUT_TESTPYPI").lower() == "true"

              if not testpypi and release != version:
                  raise SystemExit(f"Version mismatch: release '{release}' != setup.py version '{version}'")

      - name: Build wheels
        run: |
          cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "cp${{ matrix.python }}-*"
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload to PyPI
        if: ${{ !inputs.testpypi }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine check dist/*.whl
          twine upload dist/*.whl

      - name: Upload to test-PyPI
        if: ${{ inputs.testpypi }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_API_TOKEN }}
        run: |
          twine check dist/*.whl
          # HINT: if your upload fails here due to "unsupported local version",
          # put `local_scheme = "no-local-version"` pyproject.toml's
          # [tools.setuptools_scm]
          twine upload --repository testpypi --verbose dist/*.whl
