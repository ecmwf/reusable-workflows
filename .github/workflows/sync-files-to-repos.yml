name: Sync Files to Different Repos
on:
  push:
    branches:
      - main
    paths:
      - "sync-files/**" # Only trigger on changes in sync-files directory
  workflow_dispatch: # Keep manual trigger capability
    inputs:
      dry_run:
        description: "Dry run: sync into local clones and print the diffs, but don't push or open PRs"
        type: boolean
        default: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Repo File Sync Action
        # Fork fixing `exclude` with `template`: https://github.com/BetaHuhn/repo-file-sync-action/issues/346
        uses: ecmwf/repo-file-sync-action@54a4b3f38488cf3e059bda02aca817a5491aa5bb # v1.21.1
        with:
          GH_PAT: ${{ secrets.REPO_SYNC_ACTION_PAT }}
          GIT_EMAIL: "150700357+DeployDuck@users.noreply.github.com"
          CONFIG_PATH: sync-files/sync.yml
          IS_FINE_GRAINED: true
          COMMIT_PREFIX: "chore: "
          BRANCH_PREFIX: "chore/file-broadcast/"
          COMMIT_BODY: "Triggered from common files on https://github.com/ecmwf/reusable-workflows"
          # `inputs` is empty on push
          DRY_RUN: ${{ inputs.dry_run == true }}
          SKIP_CLEANUP: ${{ inputs.dry_run == true }}
          TMP_DIR: sync-tmp
      - name: Show Dry Run Changes
        # The action logs changes only at debug level
        if: inputs.dry_run
        run: |
          # sync-tmp/github.com/<owner>/<repo>@<branch>
          find sync-tmp -mindepth 2 -maxdepth 4 -type d -name .git | sort | while read -r gitdir; do
            repo=$(dirname "$gitdir")
            base=$(git -C "$repo" rev-list --max-parents=0 HEAD | tail -n 1)
            echo "::group::${repo#sync-tmp/}"
            git -C "$repo" --no-pager diff --stat "$base" HEAD
            git -C "$repo" --no-pager diff "$base" HEAD
            echo "::endgroup::"
          done
