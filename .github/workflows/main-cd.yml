name: Reusable CD Pipeline

on:
  workflow_call:
    inputs:
      # Standard
      config_file:
        description: 'Path to build configuration file'
        required: false
        type: string
        default: '.github/cd-config.yml'
      ref_name:
        description: 'Git ref name for artifacts and release (defaults to PR head ref or github.ref_name)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run mode - build only, no uploads or releases'
        required: false
        type: boolean
        default: false

jobs:
  detect-release-type:
    name: Detect Release Type
    runs-on: ubuntu-latest
    outputs:
      is_dry_run: ${{ steps.detect.outputs.is_dry_run }}
      is_prerelease: ${{ steps.detect.outputs.is_prerelease }}
      ref_name: ${{ steps.detect.outputs.ref_name }}
    steps:
      - name: Detect release type from ref
        id: detect
        uses: ecmwf/reusable-workflows/cd-actions/detect-release-type@cd-actions-tests-config-refactor
        with:
          ref_name: ${{ inputs.ref_name }}
          dry_run: ${{ inputs.dry_run }}
          deployment_regex: ${{ vars.TAG_REGEX_FOR_DEPLOYMENT }}
          prerelease_regex: ${{ vars.TAG_REGEX_FOR_PRERELEASE }}

  load-config:
    name: Load and Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.load-config.outputs.config }}
      build_matrix: ${{ steps.load-config.outputs.build_matrix }}
      release_enabled: ${{ steps.load-config.outputs.release_enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load and generate matrix
        id: load-config
        uses: ecmwf/reusable-workflows/cd-actions/load-config@cd-actions-tests-config-refactor
        with:
          config_file: ${{ inputs.config_file }}

  build:
    name: ${{ matrix.name }}
    if: ${{ fromJson(needs.load-config.outputs.build_matrix).include[0] != null }}
    needs: [detect-release-type, load-config]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      credentials:
        username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
      options: '--user root'
      volumes:
        - '/var/run/docker.sock:/var/run/docker.sock'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.load-config.outputs.build_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '50' }}
          fetch-tags: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build with Conda
        if: ${{ matrix.type == 'conda' }}
        uses: ecmwf/reusable-workflows/cd-actions/conda@cd-actions-tests-config-refactor
        with:
          name: ${{ matrix.name }}
          platform: ${{ matrix.conda_platform }}
          setup_conda: ${{ matrix.setup_conda }}
          ref_name: ${{ needs.detect-release-type.outputs.ref_name }}
          dry_run: ${{ needs.detect-release-type.outputs.is_dry_run }}
          test_nexus: ${{ needs.detect-release-type.outputs.is_prerelease }}
          gh_pat: ${{ secrets.GH_REPO_READ_TOKEN }}
          nexus_token: ${{ secrets.NEXUS_CONDA_UPLOAD_USER && secrets.NEXUS_CONDA_UPLOAD_TOKEN && format('{0}:{1}', secrets.NEXUS_CONDA_UPLOAD_USER, secrets.NEXUS_CONDA_UPLOAD_TOKEN) || '' }}
          nexus_test_token: ${{ secrets.NEXUS_TEST_CONDA_UPLOAD_USER && secrets.NEXUS_TEST_CONDA_UPLOAD_TOKEN && format('{0}:{1}', secrets.NEXUS_TEST_CONDA_UPLOAD_USER, secrets.NEXUS_TEST_CONDA_UPLOAD_TOKEN) || '' }}
          conda_dir: ${{ matrix.conda_dir }}
          channels: ${{ matrix.channels }}
          conda_build_args: ${{ matrix.conda_build_args }}
          skip_installation_test: ${{ matrix.skip_installation_test }}

      - name: Build with Python PyPI
        if: ${{ matrix.type == 'python-pypi' }}
        uses: ecmwf/reusable-workflows/cd-actions/python-pypi@cd-actions-tests-config-refactor
        with:
          name: ${{ matrix.name }}
          ref_name: ${{ needs.detect-release-type.outputs.ref_name }}
          dry_run: ${{ needs.detect-release-type.outputs.is_dry_run }}
          pypi_token: ${{ secrets.PYPI_API_TOKEN }}
          pypi_test_token: ${{ secrets.PYPI_TEST_API_TOKEN }}
          working_directory: ${{ matrix.working_directory }}
          buildargs: ${{ matrix.buildargs }}
          env_vars: ${{ matrix.env_vars }}
          testpypi: ${{ needs.detect-release-type.outputs.is_prerelease }}

      - name: Build with HPC
        if: ${{ matrix.type == 'hpc' }}
        uses: ecmwf/reusable-workflows/cd-actions/hpc@cd-actions-tests-config-refactor
        with:
          name: ${{ matrix.name }}
          ref_name: ${{ needs.detect-release-type.outputs.ref_name }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          dry_run: ${{ needs.detect-release-type.outputs.is_dry_run }}
          github_user: ${{ secrets.BUILD_PACKAGE_HPC_GITHUB_USER }}
          github_token: ${{ secrets.GH_REPO_READ_TOKEN }}
          troika_user: ${{ secrets.HPC_CI_SSH_USER }}
          platform: ${{ matrix.platform }}
          install_prefix: ${{ matrix.install_prefix }}
          prefix_compiler_specific: ${{ matrix.prefix_compiler_specific }}
          cmake_options: ${{ matrix.cmake_options }}
          ctest_options: ${{ matrix.ctest_options }}
          self_test: ${{ matrix.self_test }}
          env_vars: ${{ matrix.env_vars }}
          parallel: ${{ matrix.parallel }}
          dependencies: ${{ matrix.dependencies }}
          dependency_cmake_options: ${{ matrix.dependency_cmake_options }}
          python_dependencies: ${{ matrix.python_dependencies }}
          python_version: ${{ matrix.python_version }}
          python_requirements: ${{ matrix.python_requirements }}
          python_toml_opt_dep_sections: ${{ matrix.python_toml_opt_dep_sections }}
          conda_deps: ${{ matrix.conda_deps }}
          stages: ${{ matrix.stages }}
          modules: ${{ matrix.modules }}
          install_command: ${{ matrix.install_command }}
          lock_permissions: ${{ matrix.lock_permissions }}
          sync_module: ${{ matrix.sync_module }}
          module_name: ${{ matrix.module_name }}
          ntasks: ${{ matrix.ntasks }}
          gpus: ${{ matrix.gpus }}
          queue: ${{ matrix.queue }}
          post_script: ${{ matrix.post_script }}
          clean_before_install: ${{ matrix.clean_before_install }}
          dry_run_install: ${{ matrix.dry_run_install }}
          dry_run_install_prefix: ${{ matrix.dry_run_install_prefix }}
          site: ${{ matrix.site }}
          is_prerelease: ${{ needs.detect-release-type.outputs.is_prerelease }}
          tag_module: ${{ matrix.tag_module }}
          module_tag_name: ${{ matrix.module_tag_name || vars.HPC_MODULE_TAG_NAME || 'new' }}
          use_ninja: ${{ matrix.use_ninja }}
          force_build: ${{ matrix.force_build }}
          ecbundle: ${{ matrix.ecbundle }}
          bundle_yml: ${{ matrix.bundle_yml }}
          install_lib_dir: ${{ matrix.install_lib_dir }}
          mkdir: ${{ matrix.mkdir }}
          pytest_cmd: ${{ matrix.pytest_cmd }}
          workdir: ${{ matrix.workdir }}
          output_dir: ${{ matrix.output_dir }}

      - name: Build Tarball
        if: ${{ matrix.type == 'tarball' }}
        uses: ecmwf/reusable-workflows/cd-actions/tarball@cd-actions-tests-config-refactor
        with:
          name: ${{ matrix.name }}
          ref_name: ${{ needs.detect-release-type.outputs.ref_name }}
          dry_run: ${{ needs.detect-release-type.outputs.is_dry_run }}
          is_prerelease: ${{ needs.detect-release-type.outputs.is_prerelease }}
          ecbuild_version: ${{ matrix.ecbuild_version }}
          cmake_options: ${{ matrix.cmake_options }}
          confluence_token: ${{ needs.detect-release-type.outputs.is_prerelease == 'false' && needs.detect-release-type.outputs.is_dry_run == 'false' && secrets.CONFLUENCE_TARBALL_UPLOAD_TOKEN || '' }}
          confluence_space: ${{ matrix.confluence_space }}
          confluence_page_title: ${{ matrix.confluence_page_title }}

      - name: Build System Package
        if: ${{ matrix.type == 'system-package' }}
        uses: ecmwf/reusable-workflows/cd-actions/system-package@cd-actions-tests-config-refactor
        with:
          name: ${{ matrix.name }}
          ref_name: ${{ needs.detect-release-type.outputs.ref_name }}
          dry_run: ${{ needs.detect-release-type.outputs.is_dry_run }}
          skip_version_check: ${{ matrix.skip_version_check }}
          package_deps: ${{ matrix.package_deps }}
          description: ${{ matrix.description }}
          license: ${{ matrix.license }}
          maintainer: ${{ matrix.maintainer }}
          vendor: ${{ matrix.vendor }}
          homepage_url: ${{ matrix.homepage_url }}
          install_prefix: ${{ matrix.install_prefix }}
          self_test: ${{ matrix.self_test }}
          install_test: ${{ matrix.install_test }}
          install_test_os_image: ${{ matrix.install_test_os_image }}
          install_test_command: ${{ matrix.install_test_command }}
          build_type: ${{ matrix.build_type }}
          env: ${{ matrix.env }}
          deb_section: ${{ matrix.deb_section }}
          deb_priority: ${{ matrix.deb_priority }}
          rpm_group: ${{ matrix.rpm_group }}
          os: ${{ matrix.os }}
          dependencies: ${{ matrix.dependencies }}
          dependency_branch: ${{ matrix.dependency_branch }}
          cmake_options: ${{ matrix.cmake_options }}
          ctest_options: ${{ matrix.ctest_options }}
          dependency_cmake_options: ${{ matrix.dependency_cmake_options }}
          cmake: ${{ matrix.cmake }}
          ecbundle: ${{ matrix.ecbundle }}
          self_build: ${{ matrix.self_build }}
          toolchain_file: ${{ matrix.toolchain_file }}
          parallelism_factor: ${{ matrix.parallelism_factor }}
          compiler_cc: ${{ matrix.compiler_cc }}
          compiler_cxx: ${{ matrix.compiler_cxx }}
          compiler_fc: ${{ matrix.compiler_fc }}
          cache_suffix: ${{ matrix.cache_suffix }}
          save_cache: ${{ matrix.save_cache }}
          recreate_cache: ${{ matrix.recreate_cache }}
          gh_pat: ${{ secrets.GH_REPO_READ_TOKEN }}
          nexus_token: ${{ (needs.detect-release-type.outputs.is_prerelease == 'false' && matrix.nexus_token_secret_prod != '') && secrets[matrix.nexus_token_secret_prod] || secrets[matrix.nexus_token_secret_test] }}
          nexus_url: ${{ (needs.detect-release-type.outputs.is_prerelease == 'false' && matrix.nexus_url_secret_prod != '') && secrets[matrix.nexus_url_secret_prod] || secrets[matrix.nexus_url_secret_test] }}

  release:
    name: Create Release
    if: ${{ always() && needs.load-config.outputs.release_enabled == 'true' && needs.detect-release-type.outputs.is_dry_run == 'false' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    needs: [detect-release-type, load-config, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare release configuration
        id: prepare-config
        run: |
          config='${{ needs.load-config.outputs.config }}'
          is_prerelease='${{ needs.detect-release-type.outputs.is_prerelease }}'

          # Inject prerelease flag into config
          updated_config=$(echo "$config" | yq eval ".release.config.prerelease = ($is_prerelease == \"true\")" -)

          echo "config<<EOF" >> $GITHUB_OUTPUT
          echo "$updated_config" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: ecmwf/reusable-workflows/cd-actions/release@cd-actions-tests-config-refactor
        with:
          config: ${{ steps.prepare-config.outputs.config }}
          ref_name: ${{ needs.detect-release-type.outputs.ref_name }}
