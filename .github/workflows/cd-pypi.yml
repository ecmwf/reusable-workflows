---
name: cd-pypi

on:
  workflow_call:
    inputs:
      testpypi:
        description: Whether to upload to testpypi instead of pypi.
          Requires secrets.PYPI_TEST_API_TOKEN to be defined.
        type: boolean
        required: false
        default: false
      working-directory:
        description: Working directory to build Python package (for monorepos).
          Defaults to root directory.
        type: string
        required: false
        default: "./"
      buildargs:
        description: Args to pass in to build as `python -m build {buildargs}`
          e.g. '--sdist' for just source distribution
        type: string
        required: false
        default: ''
      env_vars:
        description: A way to set env variables
        type: string
        required: false
        default: ''


jobs:
  deploy:
    if: ${{ github.ref_type == 'tag' || github.event_name == 'release' || inputs.testpypi }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Set env variables from input
        if: inputs.env_vars != ''
        env:
          ENV_VARS: ${{ inputs.env_vars }}
        run: |
          for key in $(echo "$ENV_VARS" | jq -r 'keys[]'); do
            if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || [[ "${key^^}" =~ ^(PATH|BASH_ENV|ENV|NODE_OPTIONS|LD_.*|GITHUB_.*|RUNNER_.*|ACTIONS_.*)$ ]]; then
              echo "::error::Refusing to set environment variable '$key'"
              exit 1
            fi
            value=$(echo "$ENV_VARS" | jq -r --arg key "$key" '.[$key]')
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::Value of environment variable '$key' contains a newline"
              exit 1
            fi
            echo "$key=$value" >> $GITHUB_ENV
          done
        shell: bash

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: "0"

      - name: Test tag name pattern
        if: ${{ !inputs.testpypi }}
        shell: python
        env:
          TAG_PATTERN: ${{ vars.TAG_REGEX_FOR_DEPLOYMENT }}
        run: |
          import os
          import re
          import sys

          tag_pattern = os.environ.get("TAG_PATTERN", "")
          ref = os.environ["GITHUB_REF_NAME"]

          if not tag_pattern:
            sys.exit(0)

          if not re.match(tag_pattern, ref):
            print(f"::error::{ref} does not match {tag_pattern}")
            sys.exit(1)

      - name: Test branch name pattern
        if: ${{ vars.BRANCH_REGEX_FOR_DEPLOYMENT != '' && !inputs.testpypi }}
        env:
          BRANCH_PATTERN: ${{ vars.BRANCH_REGEX_FOR_DEPLOYMENT }}
        run: |
          echo "Checking that this release is being made from a main/master branch ( $BRANCH_PATTERN ) - will fail if not"
          git branch --all --list --format "%(refname:lstrip=3)" --contains "$GITHUB_REF_NAME" | grep -E "$BRANCH_PATTERN"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine build

      - name: Check version
        env:
          TESTPYPI: ${{ inputs.testpypi }}
        run: |
          if [ -f "setup.py" ]; then
            if [ -f "pyproject.toml" ] ; then
              # we need to install eg setuptools_scm to correctly determine version later
              extra_deps=$(python -c 'import tomllib; print(" ".join(f"{e}" for e in tomllib.load(open("pyproject.toml", "rb")).get("build-system", {}).get("requires", "")))')
              if [ -n "$extra_deps" ]; then
                pip install --upgrade $extra_deps
              fi
            fi
            version=$(python setup.py --version)
            release="$GITHUB_REF_NAME"
            if [ "$TESTPYPI" != "true" ] ; then test "$release" == "$version"; fi
          fi

      - name: Build and publish to pypi
        if: ${{ !inputs.testpypi }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          BUILDARGS: ${{ inputs.buildargs }}
        run: |
          mapfile -d '' -t buildargs < <(printf '%s' "$BUILDARGS" | xargs -r printf '%s\0')
          python -m build "${buildargs[@]}"
          twine check dist/*
          twine upload dist/*

      - name: Build and publish to testpypi
        if: ${{ inputs.testpypi }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_API_TOKEN }}
          BUILDARGS: ${{ inputs.buildargs }}
        run: |
          mapfile -d '' -t buildargs < <(printf '%s' "$BUILDARGS" | xargs -r printf '%s\0')
          python -m build "${buildargs[@]}"
          twine check dist/*
          # HINT: if your upload fails here due to "unsupported local version",
          # put `local_scheme = "no-local-version"` pyproject.toml's
          # [tools.setuptools_scm]
          twine upload --repository testpypi --verbose dist/*
