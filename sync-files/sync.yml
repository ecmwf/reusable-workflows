# This configuration file is used by the file broadcasting infrastructure in .github/workflows/sync-files-to-repos.yml.
# It defines the files to be copied to the repositories listed in the `repos` field.
# You can use templating and fairly intricate logic to define the files to be copied and replaced.
# Read more here: https://github.com/ecmwf/repo-file-sync-action/ (ECMWF fork of BetaHuhn/repo-file-sync-action)
# `exclude` paths are relative to `source`; an entry ending in `/` excludes a whole folder.
#
# Layout:
# - sync-files/anemoi/  files broadcast to the anemoi repos, always overwritten; use `exclude` per repo
# - sync-files/init/    files created once and then owned by each repo (`replace: false`). They can't live in
#                       sync-files/anemoi/: `replace: false` is checked against the entry's `dest`, which is `./`
#                       for a whole folder and always exists, so the whole folder would be skipped.
# - sync-files/general/ generic Python project files (LICENSE, dependabot)
group:
##################
# Anemoi Files   #
##################

# Common Anemoi files
- files:
  - source: sync-files/general/python/
    dest: ./
    template:
      year: 2024-2025
      authors: Anemoi Contributors
  repos: |
    ecmwf/anemoi-core
    ecmwf/anemoi-datasets
    ecmwf/anemoi-inference
    ecmwf/anemoi-registry
    ecmwf/anemoi-transform
    ecmwf/anemoi-utils
    ecmwf/anemoi-plugins

# Init specific files once
- files:
  - source: sync-files/init/.release-please-manifest.json
    dest: ./.release-please-manifest.json
    replace: false
  - source: sync-files/init/.readthedocs.yaml
    dest: ./.readthedocs.yaml
    replace: false
  repos: |
    ecmwf/anemoi-datasets
    ecmwf/anemoi-inference
    ecmwf/anemoi-registry
    ecmwf/anemoi-transform
    ecmwf/anemoi-utils
    ecmwf/anemoi-plugins

# Anemoi Datasets specific
- files:
  - source: sync-files/anemoi/
    dest: ./
    template:
      repo_name: anemoi-datasets
      year: 2024-2025
      authors: Anemoi Contributors
      short_description: "Datasets for training data-driven weather forecasts."
  repos: |
    ecmwf/anemoi-datasets

# Anemoi plugins specific
- files:
  - source: sync-files/anemoi/
    dest: ./
    template:
      repo_name: anemoi-plugins
      year: 2024-2025
      authors: Anemoi Contributors
      short_description: "Plugins for use with anemoi."
    exclude: |
      .github/workflows/push-to-private.yml
  repos: |
    ecmwf/anemoi-plugins


# Anemoi inference specific
- files:
  - source: sync-files/anemoi/
    dest: ./
    template:
      repo_name: anemoi-inference
      year: 2024-2025
      authors: Anemoi Contributors
      short_description: "Inference tools for data-driven weather forecasts."
    exclude: |
      .github/workflows/push-to-private.yml
  repos: |
    ecmwf/anemoi-inference


# Anemoi Registry specific
- files:
  - source: sync-files/anemoi/
    dest: ./
    template:
      repo_name: anemoi-registry
      year: 2024-2025
      authors: Anemoi Contributors
      short_description: "Registry for data-driven weather forecasts."
    exclude: |
      .release-please-config.json
      .github/CODEOWNERS
      .github/workflows/downstream-ci-hpc.yml
      .github/workflows/pr-label-ats.yml
      .github/workflows/push-to-private.yml
  - source: sync-files/general/python/LICENSE
    dest: LICENSE
    template:
      year: 2024-2025
      authors: Anemoi Contributors
  repos: |
    ecmwf/anemoi-registry


# Anemoi transform specific
- files:
  - source: sync-files/anemoi/
    dest: ./
    template:
      repo_name: anemoi-transform
      year: 2024-2025
      authors: Anemoi Contributors
      short_description: "Miscellanous data transformation functions for training data-driven weather forecasts."
    exclude: |
      .github/workflows/push-to-private.yml
  repos: |
    ecmwf/anemoi-transform


# Anemoi utils specific
- files:
  - source: sync-files/anemoi/
    dest: ./
    template:
      repo_name: anemoi-utils
      year: 2024-2025
      authors: Anemoi Contributors
      short_description: "Miscellanous tools for training data-driven weather forecasts."
    exclude: |
      .github/workflows/push-to-private.yml
  repos: |
    ecmwf/anemoi-utils

# Anemoi specific
- files:
  - source: sync-files/anemoi/
    dest: ./
    template:
      repo_name: anemoi
    exclude: |
      README.md
      .release-please-config.json
      .github/CODEOWNERS
      .github/workflows/downstream-ci-hpc.yml
      .github/workflows/push-to-private.yml
      .github/workflows/python-publish.yml
      .github/workflows/python-pull-request.yml
      .github/workflows/readthedocs-pr-update.yml
      .github/workflows/release-please.yml
  - source: sync-files/general/python/LICENSE
    dest: LICENSE
    template:
      year: 2024-2025
      authors: Anemoi Contributors
  repos: |
    ecmwf/anemoi

# Anemoi Core specific
- files:
  - source: sync-files/anemoi/
    dest: ./
    template:
      repo_name: anemoi-core
    exclude: |
      README.md
      .release-please-config.json
      .github/CODEOWNERS
      .github/labeler.yml
      .github/workflows/downstream-ci-hpc.yml
      .github/workflows/push-to-private.yml
      .github/workflows/python-publish.yml
      .github/workflows/python-pull-request.yml
      .github/workflows/readthedocs-pr-update.yml
      .github/workflows/release-please.yml
  - source: sync-files/general/python/LICENSE
    dest: graphs/LICENSE
    template:
      year: 2024-2025
      authors: Anemoi Contributors
  - source: sync-files/general/python/LICENSE
    dest: models/LICENSE
    template:
      year: 2024-2025
      authors: Anemoi Contributors
  - source: sync-files/general/python/LICENSE
    dest: training/LICENSE
    template:
      year: 2024-2025
      authors: Anemoi Contributors
  - source: sync-files/anemoi/CONTRIBUTORS.md
    dest: graphs/CONTRIBUTORS.md
    template:
      repo_name: anemoi-graphs
  - source: sync-files/anemoi/CONTRIBUTORS.md
    dest: models/CONTRIBUTORS.md
    template:
      repo_name: anemoi-models
  - source: sync-files/anemoi/CONTRIBUTORS.md
    dest: training/CONTRIBUTORS.md
    template:
      repo_name: anemoi-training
  - source: sync-files/general/python/.github/dependabot.yml
    dest: .github/dependabot.yml
  repos: |
    ecmwf/anemoi-core
