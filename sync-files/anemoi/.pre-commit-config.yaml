# This file is synced from https://github.com/ecmwf/reusable-workflows/tree/main/sync-files
# Tool configuration (line length, rules, ...) belongs into pyproject.toml, not into hook args.
repos:
- repo: local
  hooks:
  - id: protect-synced-files
    name: protect files synced from ecmwf/reusable-workflows
    language: python
    entry: python tools/check_synced_files.py
    files: |
      (?x)^(
        \.gitignore
        |\.pre-commit-config\.yaml
        |\.release-please-config\.json
        |CONTRIBUTORS\.md
        |LICENSE
        |README\.md
        |\.github/CODEOWNERS
        |\.github/dependabot\.yml
        |\.github/labeler\.yml
        |\.github/pull_request_template\.md
        |\.github/workflows/downstream-ci-hpc\.yml
        |\.github/workflows/inactivity-bot\.yml
        |\.github/workflows/pr-conventional-commit\.yml
        |\.github/workflows/pr-label-ats\.yml
        |\.github/workflows/pr-label-file-based\.yml
        |\.github/workflows/pr-protect-synced-files\.yml
        |\.github/workflows/push-to-private\.yml
        |\.github/workflows/python-publish\.yml
        |\.github/workflows/python-pull-request\.yml
        |\.github/workflows/readthedocs-pr-update\.yml
        |\.github/workflows/release-please\.yml
        |tools/check_synced_files\.py
        |tools/pre-commit-copyright-notice\.txt
        |(graphs|models|training)/(CONTRIBUTORS\.md|LICENSE)
      )$
# Empty notebooks
- repo: local
  hooks:
  - id: clear-notebooks-output
    name: clear-notebooks-output
    files: tools/.*\.ipynb$
    stages: [pre-commit]
    language: python
    entry: jupyter nbconvert --ClearOutputPreprocessor.enabled=True --inplace
    additional_dependencies: [jupyter]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml # Check YAML files for syntax errors only
    args: [--unsafe, --allow-multiple-documents]
  - id: check-toml # Check TOML files for syntax errors
  - id: check-case-conflict # Check for files that would conflict on case-insensitive filesystems
  - id: debug-statements # Check for debugger imports and py37+ breakpoint()
  - id: end-of-file-fixer # Ensure files end in a newline
  - id: trailing-whitespace # Trailing whitespace checker
  - id: no-commit-to-branch # Prevent committing to main / master
  - id: check-added-large-files # Check for large files added to git
  - id: check-merge-conflict # Check for files that contain merge conflict
- repo: https://github.com/pre-commit/pygrep-hooks
  rev: v1.10.0
  hooks:
  - id: python-use-type-annotations # Check for missing type annotations
  - id: python-check-blanket-noqa # Check for # noqa: all
  - id: python-no-log-warn # Check for log.warn
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.8
  hooks:
  - id: ruff-check
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format # after ruff-check, whose fixes may need reformatting
- repo: https://github.com/sphinx-contrib/sphinx-lint
  rev: v1.0.2
  hooks:
  - id: sphinx-lint
- repo: https://github.com/b8raoult/pre-commit-docconvert
  rev: "0.1.5"
  hooks:
  - id: docconvert
    args: ["numpy"]
- repo: https://github.com/b8raoult/pre-commit-copyright-notice
  rev: "0.3.0"
  hooks:
  - id: copyright-notice
    args:
    - --exclude=docs/**/*.py
    - --fix
    - --exit-non-zero-on-fix
    - --holder
    - Anemoi contributors
    - --license
    - tools/pre-commit-copyright-notice.txt
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: "v2.29.4"
  hooks:
  - id: pyproject-fmt
- repo: https://github.com/jshwi/docsig # Check docstrings against function sig
  rev: v0.96.0
  hooks:
  - id: docsig
